plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    flatDir {
        // Drop sibling addon jars (electroenergetics, petrochem) here to compile
        // against them without a maven/composite setup. See "Sibling addon
        // dependencies" below and the README.
        dirs 'libs'
    }
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Create stack (identical to the sibling addons) ---
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // --- Sibling addon dependencies ---
    // Create: Electro Energetics is REQUIRED on the compile classpath: the turbine
    // subclasses GeneratingDevice and implements ElectricalDeviceBlock.
    // Petrochem is only needed at RUNTIME (its fuels are referenced by id in data).
    //
    // Pick ONE sourcing strategy and uncomment it (see README for details):
    //
    //   (A) Local jars in libs/  (works with the flatDir repo above):
    compileOnly("electroenergetics:electroenergetics-neoforge-${minecraft_version}:${electroenergetics_version}")
    runtimeOnly("electroenergetics:electroenergetics-neoforge-${minecraft_version}:${electroenergetics_version}")
    runtimeOnly("petrochem:petrochem-neoforge-${minecraft_version}:${petrochem_version}")
    //
    //   (B) CurseForge maven (fill in the project/file IDs from CurseForge):
    // compileOnly("curse.maven:create-electro-energetics-PROJECTID:FILEID")
    // runtimeOnly("curse.maven:create-electro-energetics-PROJECTID:FILEID")
    // runtimeOnly("curse.maven:petrochem-PROJECTID:FILEID")
    //
    //   (C) Gradle composite build: uncomment the includeBuild lines in
    //       settings.gradle and replace the coordinates above with the sibling
    //       module coords (com.george_vi.electroenergetics:electroenergetics-neoforge-1.21.1
    //       and io.github.hadron13.gearbox:petrochem-neoforge-1.21.1).
}

// Expand mod metadata templates (neoforge.mods.toml) with gradle.properties values.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
